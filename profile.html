<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | PixelPlay</title>
    <link rel="icon" type="image/png" href="assests/images/games/android-chrome-512x512.png">
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav id="main-nav">
    <div class="nav-container">
        <div id="logo">
            <span style="color:#00ff00;">Pixel</span><span style="color:#ff00ff;">Play</span>
        </div>
        <div class="menu-toggle" id="menu-toggle">☰</div>
        <ul class="nav-links">
<li><a href="index.html" data-en="Home" data-ar="الرئيسية">Home</a></li>
<li><a href="games.html" data-en="Games" data-ar="الألعاب">Games</a></li>
<li><a href="explore.html" data-en="Explore" data-ar="استكشاف">Explore</a></li>
<li><button id="user-search-toggle" class="user-search-toggle">🔍</button></li>
<li><button id="lang-toggle" class="lang-btn">AR</button></li>
<li><a href="account.html" id="auth-link" data-en="Account" data-ar="حسابي">Account</a></li>
</nav>
<div id="user-search-modal" class="user-search-modal">
    <div class="user-search-box">
        <button id="close-user-search" class="user-search-close">×</button>

        <h2>Find Players</h2>

        <input type="text" id="global-user-search-input" placeholder="Search player name...">

        <div id="global-user-search-results">
            <p style="color:#aaa;">Start typing to find players.</p>
        </div>
    </div>
</div>
<main class="container profile-pro-page">

    <section class="profile-cover-card">
        <div class="profile-cover-content">
            <div class="public-profile-avatar">🎮</div>

            <div class="profile-pro-info">
                <span class="section-kicker">PLAYER PROFILE</span>
                <h1 id="public-player-name">Loading...</h1>
                <p id="public-player-bio">PixelPlay Gamer</p>
            </div>

            <button class="profile-edit-shortcut" id="public-follow-btn">
                Follow
            </button>
        </div>
    </section>

    <section class="profile-stats-strip">
        <div>
            <strong id="public-library-count">0</strong>
            <span>Library</span>
        </div>

        <div>
            <strong id="public-reviews-count">0</strong>
            <span>Reviews</span>
        </div>

        <div>
            <strong id="public-followers-count">0</strong>
            <span>Followers</span>
        </div>
    </section>

    <section class="profile-main-clean">

        <section class="profile-section-block">
            <div class="profile-section-head">
                <div>
                    <span>LIBRARY</span>
                    <h2>Games</h2>
                </div>
            </div>

            <div id="public-library-list">
                <p style="color:#aaa;">Loading library...</p>
            </div>
        </section>

        <section class="profile-section-block">
            <div class="profile-section-head">
                <div>
                    <span>ACTIVITY</span>
                    <h2>Reviews</h2>
                </div>
            </div>

            <div id="public-reviews-list">
                <p style="color:#aaa;">Loading reviews...</p>
            </div>
        </section>

    </section>

</main>

<footer class="site-footer">
    <p>© 2026 PixelPlay. All rights reserved.</p>
</footer>

<script type="module" src="navbar-auth.js"></script>
<script type="module" src="public-profile.js"></script>
<script src="script.js"></script>
<script type="module" src="global-search.js"></script>
<script src="language.js"></script>
</body>
</html>
