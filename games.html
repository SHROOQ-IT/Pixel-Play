<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelPlay | Game Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
    <nav id="main-nav">
        <div class="nav-container">
            <div id="logo">
                <span style="color:#00ff00;">Pixel</span><span style="color:#ff00ff;">Play</span>
            </div>
<div class="menu-toggle" id="menu-toggle">
    ☰
</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="games.html" class="active">Games</a></li>
                <li><a href="tips.html">Tips</a></li>
                <li><a href="members.html">Hub</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" id="auth-link">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h1 class="page-title">Game Catalog</h1>
        
        <section class="game-search">
            <input type="text" id="search-input" placeholder="Search games...">

            <div class="filters">
                <select id="genre-filter">
                    <option value="all">All Genres</option>
                    <option value="Battle Royale">Battle Royale</option>
                    <option value="Action">Action</option>
                    <option value="Adventure">Adventure</option>
                    <option value="RPG">RPG</option>
                    <option value="FPS">FPS</option>
                    <option value="Sandbox">Sandbox</option>
                    <option value="Racing">Racing</option>
                    <option value="Social Deduction">Social Deduction</option>
                </select>

                <select id="platform-filter">
                    <option value="all">All Platforms</option>
                    <option value="PC">PC</option>
                    <option value="Console">Console</option>
                    <option value="Mobile">Mobile</option>
                    <option value="PS5">PS5</option>
                    <option value="Switch">Switch</option>
                </select>

                <select id="sort-filter">
                    <option value="default">Sort By</option>
                    <option value="rating-high">Highest Rated</option>
                    <option value="newest">Newest</option>
                    <option value="az">A - Z</option>
                </select>
            </div>
        </section>
        
        <section class="game-table-section">
            <table id="game-table">
                <thead>
                    <tr>
                        <th>Game Title</th>
                        <th>Genre</th>
                        <th>Platform</th>
                        <th>Release Date</th>
                        <th>Rating</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="games-table-body"></tbody>
            </table>
        </section>
        
        <section class="upcoming-games">
            <h2>Coming Soon</h2>
            <div class="game-cards" id="coming-soon-games"></div>
        </section>
    </main>

    <div id="game-modal" class="game-modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>

            <img id="modal-image" src="" alt="Game Image">

            <h2 id="modal-title"></h2>
            <p id="modal-description"></p>

            <div class="modal-info">
                <span id="modal-genre"></span>
                <span id="modal-platform"></span>
                <span id="modal-rating"></span>
            </div>

            <div style="padding: 0 1.5rem 1.5rem;">
                <button class="wishlist-btn" id="modal-wishlist-btn">
                    + Add to Wishlist
                </button>
            </div>

            <section class="reviews-section">
                <h3>Player Reviews</h3>

                <div class="review-form">
                    <select id="review-rating">
                        <option value="5">★★★★★ 5</option>
                        <option value="4">★★★★☆ 4</option>
                        <option value="3">★★★☆☆ 3</option>
                        <option value="2">★★☆☆☆ 2</option>
                        <option value="1">★☆☆☆☆ 1</option>
                    </select>

                    <textarea id="review-text" placeholder="Write your review..."></textarea>

                    <button class="cta-button" id="submit-review-btn">
                        Submit Review
                    </button>
                </div>

                <div id="reviews-list">
                    <p style="color:#ccc;">No reviews yet.</p>
                </div>
            </section>
        </div>
    </div>
<script type="module" src="navbar-auth.js"></script>
<script type="module" src="games-render.js"></script>
<script type="module" src="wishlist.js"></script>
<script type="module" src="reviews.js"></script>
<script src="script.js"></script>
<footer class="site-footer">
    <p>© 2026 PixelPlay. All rights reserved.</p>
    <span>Built with passion for gaming 🎮</span>
</footer>
</body>
</html>
