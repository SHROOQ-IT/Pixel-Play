<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PixelPlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="main-nav">
        <div class="nav-container">
            <div id="logo">
                <span style="color:#00ff00;">Pixel</span><span style="color:#ff00ff;">Play</span>
            </div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="games.html">Games</a></li>
                <li><a href="tips.html">Tips</a></li>
                <li><a href="members.html">Hub</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="login.html" id="auth-link" class="active">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="container">
        <h1 class="page-title">Player Access</h1>

        <section class="login-card" id="auth-card">
            <div class="login-icon">🎮</div>

            <h2>Welcome to PixelPlay</h2>
            <p class="login-subtitle">Login or create an account to save games, write reviews, and build your library.</p>

            <div class="form-group">
                <label for="username">Name <span class="optional-text">(for new accounts)</span></label>
                <input type="text" id="username" placeholder="Enter your player name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password">
            </div>

            <div class="login-actions">
                <button class="cta-button" id="login-btn">Login</button>
                <button class="cta-button secondary-btn" id="register-btn">Register</button>
            </div>

            <p id="auth-message"></p>
        </section>

        <section class="login-card logged-card" id="logged-card" style="display:none;">
            <div class="login-icon">👤</div>

            <h2 id="logged-title">Already Logged In</h2>
            <p id="logged-email"></p>

            <div class="login-actions">
                <button class="cta-button" onclick="location.href='account.html'">Go to Account</button>
                <button class="cta-button secondary-btn" onclick="location.href='games.html'">Browse Games</button>
                <button class="cta-button logout-btn" id="logout-btn">Logout</button>
            </div>
        </section>
    </main>

    <script type="module" src="navbar-auth.js"></script>
    <script type="module" src="auth.js"></script>
    <footer class="site-footer">
    <p>© 2026 PixelPlay. All rights reserved.</p>
    <span>Built with passion for gaming 🎮</span>
</footer>
</body>
</html>
